<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #ffd6e4;
    }

    /* HEART SHAPED BACKGROUND */
    .heart-bg {
      position: fixed;
      width: 140vmax;
      height: 140vmax;
      background: radial-gradient(circle at center,
        #ffe4ee 0%,
        #ffb6cf 30%,
        #ff8fb8 55%,
        #ff6fa3 75%,
        #ff4d8d 100%
      );
      clip-path: path(
        "M 50 15
         C 35 -5, 0 10, 50 60
         C 100 10, 65 -5, 50 15 Z"
      );
      animation: pulse 7s ease-in-out infinite;
      filter: blur(2px);
      z-index: -1;
    }

    @keyframes pulse {
      0%   { transform: scale(0.95); opacity: 0.85; }
      50%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.85; }
    }

    /* CARD */
    .card {
      background: rgba(255,255,255,0.92);
      padding: 40px 30px;
      border-radius: 22px;
      text-align: center;
      width: 320px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: fadeIn 1.4s ease;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    h1 {
      margin: 0 0 25px;
      color: #c2185b;
      font-size: 24px;
    }

    .buttons {
      position: relative;
      height: 90px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #e91e63;
      color: white;
    }

    #no {
      background: #ddd;
      position: absolute;
      left: 160px;
      top: 0;
    }

    #message {
      display: none;
      margin-top: 20px;
      font-size: 16px;
      color: #333;
      line-height: 1.4;
    }

    /* FLOATING SMOOTH HEARTS */
    .heart {
      position: fixed;
      width: 14px;
      height: 14px;
      background: rgba(233, 30, 99, 0.35);
      transform: rotate(45deg);
      pointer-events: none;
      animation: float 8s linear forwards;
      filter: blur(0.5px);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: rgba(233, 30, 99, 0.35);
      border-radius: 50%;
    }

    .heart::before {
      top: -7px;
      left: 0;
    }

    .heart::after {
      left: -7px;
      top: 0;
    }

    @keyframes float {
      from {
        transform: rotate(45deg) translate(0, 0) scale(0.8);
        opacity: 0.7;
      }
      to {
        transform: rotate(45deg)
          translate(
            calc(-120px + 240px * var(--x)),
            calc(-120px + 240px * var(--y))
          )
          scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="heart-bg"></div>

  <div class="card">
    <h1>Will you be my Valentine?</h1>

    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>

    <div id="message">
      I knew it.<br />
      This moment means everything to me.
    </div>
  </div>

  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");
    const music = document.getElementById("music");

    noBtn.addEventListener("mouseenter", () => {
      const x = Math.random() * 140;
      const y = Math.random() * 60;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.addEventListener("click", () => {
      message.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
      music.play();
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = Math.random() * 100 + "vh";
      heart.style.animationDuration = 6 + Math.random() * 4 + "s";
      heart.style.setProperty("--x", Math.random());
      heart.style.setProperty("--y", Math.random());
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
